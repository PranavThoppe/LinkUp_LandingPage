<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkUp – Schedule inside iMessage</title>
  <meta name="description"
    content="LinkUp brings the power of when2meet directly into iMessage. No links to open, no accounts to create. Schedule with friends, instantly." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            'zoom-in-95': { from: { opacity: '0', transform: 'scale(.95)' }, to: { opacity: '1', transform: 'scale(1)' } }
          },
          animation: { 'zoom-in-95': 'zoom-in-95 0.7s ease forwards' }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0a0a0a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    @keyframes zoom-in-95 {
      from {
        opacity: 0;
        transform: scale(.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes typing-bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-4px);
      }
    }

    .animate-zoom {
      animation: zoom-in-95 0.7s ease forwards;
    }

    ::selection {
      background: rgba(59, 130, 246, 0.3);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Constants & Mock Data ---
    const USERS = [
      { id: 's', name: 'Sarah', color: '#22c55e', initials: 'S' },
      { id: 'j', name: 'Justin', color: '#3b82f6', initials: 'J' },
      { id: 'p', name: 'Patty', color: '#ec4899', initials: 'P' },
    ];

    const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const TIMES = ['Morn', 'Aftn', 'Eve', 'Night'];

    // --- Lucide Icons (inline SVG) ---
    const Icon = ({ d, size = 20, className = '', fill = 'none', strokeWidth = 2 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round"
        strokeLinejoin="round" className={className}>
        {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
      </svg>
    );

    const ChevronRight = ({ size = 20, className = '' }) => <Icon size={size} className={className} d="M9 18l6-6-6-6" />;
    const Globe = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z", "M2 12h20", "M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"]} />;
    const Mic = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z", "M19 10v2a7 7 0 0 1-14 0v-2", "M12 19v3"]} />;
    const Phone = ({ size = 20, className = '' }) => <Icon size={size} className={className} d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.06 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.09a16 16 0 0 0 5.82 5.82l1.16-1.16a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16l.92.92z" />;
    const Video = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M23 7l-7 5 7 5V7z", "M1 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H1z"]} />;
    const Send = ({ size = 20, className = '' }) => <Icon size={size} className={className} fill="white" d={["M22 2L11 13", "M22 2L15 22 11 13 2 9l20-7z"]} />;
    const Plus = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M12 5v14", "M5 12h14"]} />;
    const Sparkles = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z", "M5 3v4", "M19 17v4", "M3 5h4", "M17 19h4"]} />;
    const Download = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"]} />;
    const Calendar = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M8 2v4", "M16 2v4", "M3 7h18", "M3 4a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4z"]} />;
    const Users = ({ size = 20, className = '' }) => <Icon size={size} className={className} d={["M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2", "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z", "M23 21v-2a4 4 0 0 0-3-3.87", "M16 3.13a4 4 0 0 1 0 7.75"]} />;
    const Zap = ({ size = 20, className = '' }) => <Icon size={size} className={className} fill="white" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />;

    // --- Helper Components ---
    const AvatarCircle = ({ user, size = 32 }) => (
      <div style={{
        width: size, height: size, borderRadius: '50%', background: user.color,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'white', fontSize: 10, fontWeight: 700,
        border: '2px solid black', marginLeft: size === 24 ? -6 : -8, flexShrink: 0
      }}>
        {user.initials}
      </div>
    );

    const MessageBubble = ({ text, sender, isUser = false, delay = 0 }) => {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setVisible(true), delay);
        return () => clearTimeout(t);
      }, [delay]);
      return (
        <div style={{
          display: 'flex', width: '100%', marginBottom: 8, justifyContent: isUser ? 'flex-end' : 'flex-start',
          transition: 'opacity 0.7s, transform 0.7s',
          opacity: visible ? 1 : 0, transform: visible ? 'translateY(0)' : 'translateY(16px)'
        }}>
          <div style={{ display: 'flex', flexDirection: 'column', maxWidth: '85%' }}>
            {!isUser && <span style={{ fontSize: 11, color: '#8e8e93', marginLeft: 12, marginBottom: 2 }}>{sender}</span>}
            <div style={{
              padding: '8px 14px', borderRadius: 18, fontSize: 15, lineHeight: 1.3,
              background: isUser ? '#007AFF' : '#262629', color: 'white',
              borderBottomRightRadius: isUser ? 4 : 18,
              borderBottomLeftRadius: isUser ? 18 : 4,
              boxShadow: '0 1px 4px rgba(0,0,0,0.3)'
            }}>
              {text}
            </div>
          </div>
        </div>
      );
    };

    const InteractiveWidget = ({ delay = 0 }) => {
      const [visible, setVisible] = useState(false);
      const [slots, setSlots] = useState({ '1-1': true, '3-2': true, '4-1': true });
      useEffect(() => {
        const t = setTimeout(() => setVisible(true), delay);
        return () => clearTimeout(t);
      }, [delay]);
      const toggleSlot = (d, t) => {
        const key = `${d}-${t}`;
        setSlots(prev => ({ ...prev, [key]: !prev[key] }));
      };
      if (!visible) return <div style={{ height: 350, opacity: 0 }} />;
      return (
        <div className="animate-zoom" style={{
          width: '100%', background: '#121212', border: '1px solid #333',
          borderRadius: 24, padding: 20, marginTop: 8, marginBottom: 8,
          boxShadow: '0 20px 60px rgba(0,0,0,0.6)'
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
            <div>
              <h3 style={{ color: 'white', fontWeight: 700, fontSize: 18, margin: 0 }}>Mar 30 – Apr 5</h3>
              <p style={{ color: '#8e8e93', fontSize: 12, marginTop: 4, marginBottom: 0, fontStyle: 'italic' }}>Tap to vote your availability</p>
            </div>
            <div style={{ background: 'rgba(52,199,89,0.15)', color: '#34C759', fontSize: 10, fontWeight: 700, padding: '4px 10px', borderRadius: 999 }}>
              Live Poll
            </div>
          </div>

          {/* Grid header */}
          <div style={{ display: 'grid', gridTemplateColumns: '50px 1fr', rowGap: 16 }}>
            <div />
            <div style={{ display: 'flex', justifyContent: 'space-between', paddingRight: 4 }}>
              {DAYS.map((day, i) => (
                <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                  <span style={{ color: '#8e8e93', fontSize: 10, fontWeight: 700, marginBottom: 2 }}>{day}</span>
                  <span style={{ color: 'white', fontSize: 13, fontWeight: 700 }}>{(30 + i > 31 ? 30 + i - 31 : 30 + i)}</span>
                </div>
              ))}
            </div>
            {TIMES.map((time, tIdx) => (
              <React.Fragment key={tIdx}>
                <div style={{ color: '#8e8e93', fontSize: 12, display: 'flex', alignItems: 'center', fontWeight: 500 }}>{time}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', paddingRight: 4 }}>
                  {DAYS.map((_, dIdx) => {
                    const active = slots[`${dIdx}-${tIdx}`];
                    return (
                      <button key={dIdx} onClick={() => toggleSlot(dIdx, tIdx)}
                        style={{
                          width: 28, height: 28, borderRadius: 6, border: 'none', cursor: 'pointer',
                          transition: 'all 0.3s',
                          background: active ? '#34C759' : '#262629',
                          transform: active ? 'scale(1.05)' : 'scale(1)',
                          boxShadow: active ? '0 0 10px rgba(52,199,89,0.25)' : 'none'
                        }} />
                    );
                  })}
                </div>
              </React.Fragment>
            ))}
          </div>

          <div style={{ marginTop: 24, paddingTop: 16, borderTop: '1px solid #222', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center' }}>
              <div style={{ display: 'flex', marginRight: 10, marginLeft: 8 }}>
                {USERS.map(u => <AvatarCircle key={u.id} user={u} size={24} />)}
              </div>
              <span style={{ color: '#8e8e93', fontSize: 13 }}>3 voted</span>
            </div>
            <button style={{ color: '#007AFF', fontSize: 14, fontWeight: 700, background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
              Share <ChevronRight size={14} />
            </button>
          </div>
        </div>
      );
    };

    const TypingIndicator = () => (
      <div style={{
        display: 'flex', width: '100%', marginBottom: 8, justifyContent: 'flex-start',
        animation: 'zoom-in-95 0.3s ease forwards'
      }}>
        <div style={{ display: 'flex', flexDirection: 'column', maxWidth: '85%' }}>
          <div style={{
            padding: '12px 16px', borderRadius: 18,
            background: '#262629', color: 'white',
            borderBottomLeftRadius: 4,
            display: 'flex', gap: 4, alignItems: 'center', height: 38,
            boxShadow: '0 1px 4px rgba(0,0,0,0.3)'
          }}>
            <div style={{ width: 6, height: 6, background: '#8e8e93', borderRadius: '50%', animation: 'typing-bounce 1.4s infinite ease-in-out' }} />
            <div style={{ width: 6, height: 6, background: '#8e8e93', borderRadius: '50%', animation: 'typing-bounce 1.4s infinite ease-in-out', animationDelay: '0.2s' }} />
            <div style={{ width: 6, height: 6, background: '#8e8e93', borderRadius: '50%', animation: 'typing-bounce 1.4s infinite ease-in-out', animationDelay: '0.4s' }} />
          </div>
        </div>
      </div>
    );

    const DelayedScrollMessage = ({ scrolled }) => {
      const [phase, setPhase] = useState(0);

      useEffect(() => {
        const t1 = setTimeout(() => {
          setPhase(1);
          window.scrollBy({ top: 80, behavior: 'smooth' });
        }, 2000);
        const t2 = setTimeout(() => setPhase(2), 3500);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);

      if (phase === 0) return null;

      return (
        <div style={{
          transition: 'opacity 0.5s, transform 0.5s',
          opacity: 1,
          transform: 'translateY(0)',
          pointerEvents: 'none'
        }}>
          {phase === 1 ? <TypingIndicator /> : <MessageBubble text="scroll for more info 👇" />}
        </div>
      );
    };

    // --- Main App ---
    function App() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 80);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <div style={{ minHeight: '100vh', background: '#0a0a0a', color: 'white' }}>

          {/* ── 1. HERO: iMessage View ── */}
          <section style={{ position: 'relative', display: 'flex', flexDirection: 'column', overflow: 'hidden', height: '100dvh' }}>



            {/* iMessage Header */}
            <header style={{
              position: 'fixed', top: 0, width: '100%', padding: '20px 20px 12px',
              background: 'rgba(0,0,0,0.9)', backdropFilter: 'blur(20px)',
              borderBottom: '1px solid #222', zIndex: 40,
              transition: 'transform 0.5s',
              transform: scrolled ? 'translateY(-100%)' : 'translateY(0)'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div style={{ color: '#007AFF', display: 'flex', alignItems: 'center', fontWeight: 500 }}>
                  <ChevronRight size={24} className="rotate-180" style={{ transform: 'rotate(180deg)' }} />
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                  <div style={{ display: 'flex', marginBottom: 4, marginLeft: 8 }}>
                    {[USERS[2], USERS[0], USERS[1]].map(u => <AvatarCircle key={u.id} user={u} size={32} />)}
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', fontSize: 11, fontWeight: 600, color: '#9ca3af' }}>
                    The Squad <ChevronRight size={10} />
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 16, color: '#007AFF' }}>
                  <Video size={22} />
                </div>
              </div>
            </header>

            {/* Chat Thread */}
            <div style={{
              flex: 1, paddingTop: 96, paddingBottom: 80, padding: '96px 16px 80px',
              maxWidth: 640, margin: '0 auto', width: '100%',
              display: 'flex', flexDirection: 'column'
            }}>
              <div style={{ flex: 1 }} />

              <MessageBubble text="y'all free to hang this week?" sender="Sarah" delay={300} />
              <MessageBubble text="Check the poll 👇" isUser={true} delay={800} />
              <div style={{ marginBottom: 8 }}>
                <InteractiveWidget delay={1200} />
              </div>
              <DelayedScrollMessage scrolled={scrolled} />
            </div>

            {/* iMessage Input */}
            <footer style={{
              position: 'fixed', bottom: 0, width: '100%', padding: '12px 12px 24px',
              background: 'black', borderTop: '1px solid #222', zIndex: 40,
              transition: 'transform 0.5s',
              transform: scrolled ? 'translateY(100%)' : 'translateY(0)'
            }}>
              <div style={{ maxWidth: 640, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#1a1a1a', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#8e8e93' }}>
                  <Plus size={22} />
                </div>
                <div style={{ flex: 1, background: '#1a1a1a', borderRadius: 999, padding: '6px 16px', border: '1px solid #333', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ color: '#8e8e93', fontSize: 16, paddingTop: 2, paddingBottom: 2 }}>iMessage</span>
                  <Mic size={18} style={{ color: '#8e8e93' }} />
                </div>
              </div>
              {/* iOS Home Bar */}
              <div style={{ marginTop: 16, display: 'flex', justifyContent: 'center' }}>
                <div style={{ width: 128, height: 6, background: 'rgba(255,255,255,0.2)', borderRadius: 999 }} />
              </div>
            </footer>
          </section>

          {/* ── 2. MARKETING SECTION ── */}
          <section style={{ position: 'relative', background: '#0a0a0a', padding: '40px 24px 24px', zIndex: 10, minHeight: '100dvh', display: 'flex', flexDirection: 'column' }}>
            <div style={{ maxWidth: 896, width: '100%', margin: '0 auto', flex: 1, display: 'flex', flexDirection: 'column' }}>

              {/* Value Prop */}
              <div style={{ textAlign: 'center', marginBottom: 96 }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '8px 16px', borderRadius: 999, background: 'rgba(59,130,246,0.1)', color: '#60a5fa', fontSize: 14, fontWeight: 700, marginBottom: 32, border: '1px solid rgba(59,130,246,0.2)' }}>
                  Featured on the App Store
                </div>
                <h2 style={{ fontSize: 'clamp(2.5rem,7vw,4.5rem)', fontWeight: 900, marginBottom: 32, lineHeight: 1.1, letterSpacing: '-0.03em', margin: '0 0 32px' }}>
                  Stop leaving the <span style={{ color: '#007AFF' }}>chat</span> to schedule.
                </h2>
                <p style={{ fontSize: 'clamp(1rem,2.5vw,1.25rem)', color: '#9ca3af', maxWidth: 640, margin: '0 auto', lineHeight: 1.7 }}>
                  LinkUp brings the power of when2meet directly into iMessage. No links to open, no accounts to create.
                </p>
              </div>



              {/* CTA */}
              <div style={{ background: 'linear-gradient(135deg, #007AFF, #0051AA)', borderRadius: 36, padding: 40, textAlign: 'center', position: 'relative', overflow: 'hidden', boxShadow: '0 30px 80px rgba(0,122,255,0.3)' }}>
                <div style={{ position: 'relative', zIndex: 1 }}>
                  <h3 style={{ fontSize: 'clamp(1.75rem,5vw,2.5rem)', fontWeight: 900, margin: '0 0 16px' }}>
                    Ready to stop the "when are you free" back-and-forth?
                  </h3>
                  <p style={{ color: 'rgba(255,255,255,0.8)', fontSize: 16, margin: '0 auto 32px', maxWidth: 480 }}>
                    Join 50,000+ friend groups scheduling smarter with LinkUp.
                  </p>
                  <form style={{ display: 'flex', flexDirection: 'column', gap: 16, justifyContent: 'center', maxWidth: 400, margin: '0 auto' }} onSubmit={async e => {
                    e.preventDefault();
                    const form = e.currentTarget;
                    const data = new FormData(form);
                    try {
                      await fetch('https://formspree.io/f/xlgokroo', {
                        method: 'POST',
                        body: data,
                        headers: {
                          'Accept': 'application/json'
                        }
                      });
                      alert('Added to waitlist!');
                      form.reset();
                    } catch (err) {
                      alert('Oops! There was a problem joining the waitlist.');
                    }
                  }}>
                    <div style={{ position: 'relative', flex: 1, display: 'flex', alignItems: 'center' }}>
                      <span style={{ position: 'absolute', left: 16, color: '#8e8e93', fontSize: 16, fontWeight: 500 }}>@</span>
                      <input
                        name="instagram_handle"
                        type="text"
                        placeholder="instagram_handle"
                        style={{ width: '100%', background: 'rgba(0,0,0,0.2)', color: 'white', padding: '16px 16px 16px 36px', borderRadius: 999, border: '1px solid rgba(255,255,255,0.3)', fontSize: 16, outline: 'none', transition: 'border-color 0.2s, background 0.2s' }}
                        onFocus={e => { e.currentTarget.style.borderColor = 'white'; e.currentTarget.style.background = 'rgba(0,0,0,0.4)'; }}
                        onBlur={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.3)'; e.currentTarget.style.background = 'rgba(0,0,0,0.2)'; }}
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      style={{ background: 'white', color: 'black', padding: '16px 24px', borderRadius: 999, fontWeight: 700, fontSize: 16, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, border: 'none', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: '0 8px 30px rgba(0,0,0,0.3)', whiteSpace: 'nowrap', width: '100%' }}
                      onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.05)'}
                      onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                      onMouseDown={e => e.currentTarget.style.transform = 'scale(0.97)'}
                      onMouseUp={e => e.currentTarget.style.transform = 'scale(1.05)'}>
                      Join Waitlist
                    </button>
                  </form>
                </div>
                <div style={{ position: 'absolute', top: 0, right: 0, width: 256, height: 256, background: 'rgba(255,255,255,0.08)', filter: 'blur(80px)', borderRadius: '50%', transform: 'translate(50%,-50%)' }} />
              </div>

              {/* Footer */}
              <footer style={{ marginTop: 'auto', paddingTop: 32, paddingBottom: 16, borderTop: '1px solid #222', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: 16 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <img src="LinkUp-Logo.png" alt="LinkUp Logo" style={{ width: 32, height: 32, borderRadius: 8 }} />
                  <span style={{ fontWeight: 700, fontSize: 18, letterSpacing: '-0.02em' }}>LinkUp</span>
                </div>
                <div style={{ display: 'flex', gap: 24, fontSize: 13, color: '#6b7280', fontWeight: 500 }}>
                  {['Privacy', 'Terms', 'Support'].map(l => (
                    <a key={l} href="#" style={{ color: '#6b7280', textDecoration: 'none', transition: 'color 0.2s' }}
                      onMouseEnter={e => e.currentTarget.style.color = 'white'}
                      onMouseLeave={e => e.currentTarget.style.color = '#6b7280'}>{l}</a>
                  ))}
                </div>
              </footer>
            </div>
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
